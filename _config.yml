# Required (or implicit?) for GitHub Pages
# https://help.github.com/en/github/working-with-github-pages/about-github-pages-and-jekyll#configuring-jekyll-in-your-github-pages-site
lsi: false
safe: true
source: .
incremental: false
highlighter: rouge
gist:
  noscript: false
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-remote-theme

remote_theme: "jekyll/minima@1e8a445"

# Minima config
# See https://github.com/jekyll/minima/blob/master/_config.yml
# and https://github.com/pages-themes/midnight#customizing
title: 𝄆 Cursive 𝄇
author:
  name: Patrick Rhomberg
  email: contact &> patrhom.com
description: A rambling rigmarole
#baseurl: "/site"
#url: "https://purelyapplied.github.io/"

minima:
  # skin options: classic, dark, solarized, solarized-dark
  skin: solarized
  date_format: "%Y-%m-%d"
  show_excerpts: true
  hide_site_feed_link: false
  social_links:
    - title: GitHub
      icon: github
      url: https://github.com/PurelyApplied
    - title: BSky
      icon: bluesky
#      icon: ghost
      url: https://bsky.app/profile/purelyapplied.bsky.social
    - title: LinkedIn
      icon: linkedin
#      icon: poo
      url: https://linkedin.com/in/patrick🤖-rhomberg-9730249b/

# If you want to link only specific pages in your header, uncomment
# this and add the path to the pages in order as they should show up
header_pages:
  - about-me.md

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
